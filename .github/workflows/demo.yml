name: Record README demos

# Builds the app on Windows, plays each game with scripted clicks and pushes a screenshot of
# every step to the demo-frames branch. Those screenshots become the animated demos in docs/.
on:
  workflow_dispatch:

permissions:
  contents: write # pushes the screenshots to the demo-frames branch

jobs:
  record:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the app
        run: dotnet publish src/OopGames.Desktop/OopGames.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true --output app
      - name: Play the games and take screenshots
        run: .github/demo/record-demo.ps1 -Exe "$PWD\app\OopGames.Desktop.exe" -Out "$PWD\frames"
      - name: Screenshot of the desktop if it failed
        if: failure()
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force frames | Out-Null
          $bitmap.Save("$PWD\frames\failure-desktop.png")
      - name: Publish the screenshots on the demo-frames branch
        if: always()
        run: |
          cd frames
          git init -q -b demo-frames
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo screenshots from run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" demo-frames
